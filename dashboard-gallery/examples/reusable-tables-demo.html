<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reusable Tables Demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial; padding:24px; background:#f9fafb }
    .container { max-width:900px; margin:0 auto }
    table { background:#fff; border-radius:6px; overflow:hidden }
  </style>
</head>
<body>
  <div class="container">
    <h1>Reusable Tables — Demo</h1>
    <div id="table-placeholder"></div>

    <script src="/assets/js/components/reusable-table.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function(){
        mountReusableTable('#table-placeholder', {
          columns: [ { key: 'id', label: 'ID' }, { key: 'name', label: 'Name' }, { key: 'status', label: 'Status' } ],
          rows: [ { id: 'A-1', name: 'Task A', status: 'Done' }, { id: 'B-2', name: 'Task B', status: 'In Progress' } ]
        });
      });
    </script>

    <p class="muted">This page is a local demo to verify the Reusable Table component (S2-009).</p>
  </div>
</body>
</html>
