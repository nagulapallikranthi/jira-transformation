<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home Page Integration Demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial; padding:24px; background:#f9fafb }
    .container { max-width:900px; margin:0 auto }
    .placeholder { background:#fff;padding:12px;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,0.04); margin-bottom:12px }
  </style>
</head>
<body>
  <div class="container">
    <h1>Home Page Integration — Demo</h1>

    <div id="header-placeholder" class="placeholder" data-portal-component="header"></div>
    <div id="executive-summary-placeholder" class="placeholder" data-portal-component="executive-summary"></div>
    <div id="kpi-placeholder" class="placeholder" data-portal-component="kpi-card"></div>

    <script>
      // Minimal Portal mock for demo
      window.Portal = window.Portal || (function(){
        var registry = {};
        return {
          registerComponent: function(name, factory){ registry[name] = factory },
          mount: function(name, selector, props){
            var el = document.querySelector(selector);
            if (!el) return null;
            if (registry[name]) return registry[name](el, props);
            return null;
          }
        };
      })();

      // Register demo versions of components if not present
      if (!window.Portal.registeredDummyHeader){
        window.Portal.registerComponent('header', function(el){ el.innerHTML = '<strong>Demo Header</strong>'; return { mounted:true }; });
        window.Portal.registeredDummyHeader = true;
      }
    </script>

    <script src="/assets/js/components/executive-summary.js"></script>
    <script src="/assets/js/components/reusable-table.js"></script>
    <script src="/assets/js/components/status-components.js"></script>
    <script src="/assets/js/components/homepage-integration.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function(){
        // Bootstrap the home page integration
        if (typeof bootstrapHomePage === 'function'){
          bootstrapHomePage();
        }
        // Mount executive summary explicitly for demo
        if (typeof mountExecutiveSummary === 'function') mountExecutiveSummary('#executive-summary-placeholder', { title: 'Executive Summary (Demo)' });
        // Mount a reusable table into the KPI placeholder for demo
        if (typeof mountReusableTable === 'function') mountReusableTable('#kpi-placeholder', { columns: [ {key:'id',label:'ID'},{key:'name',label:'Name'} ], rows:[{id:'1',name:'Demo'}] });
      });
    </script>

    <p class="muted">This demo verifies home page integration behavior: placeholders mount registered components.</p>
  </div>
</body>
</html>
