<!-- components/header.html — reusable header shell -->
<header class="ea-header" role="banner">
  <div class="flex items-center gap-2">
    <button class="ea-btn" aria-label="Toggle navigation" data-ea-nav-toggle>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div>
      <div class="h1">Enterprise Evidence Platform</div>
      <div class="small">Decision-ready reporting for executive and platform leaders</div>
    </div>
  </div>

  <div class="flex items-center gap-2">
    <nav aria-label="Global actions">
      <button class="ea-btn" aria-label="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="ea-btn" aria-label="Account menu">
        <span class="sr-only">Open account menu</span>
        <img src="/assets/images/avatar-placeholder.png" alt="User avatar" style="width:28px;height:28px;border-radius:6px;object-fit:cover">
      </button>
    </nav>
  </div>
</header>
