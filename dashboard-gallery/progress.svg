<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="140" viewBox="0 0 600 140" role="img" aria-label="Sprint progress gauge">
  <style>
    .bg { fill: #f3f4f6; }
    .bar-bg { fill: #e5e7eb; rx:8; ry:8; }
    .bar { fill: #10b981; rx:8; ry:8; }
    .text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; font-size:16px; fill:#111827; }
    .muted { fill:#6b7280; font-size:13px }
  </style>

  <rect class="bg" width="100%" height="100%" rx="8" />

  <text x="24" y="36" class="text">Sprint Progress</text>
  <text x="24" y="58" class="muted">Overall: 39% (7 of 18 tasks implemented — Ready for Verification or Complete)</text>

  <!-- Progress bar background -->
  <g transform="translate(24,72)">
    <rect class="bar-bg" x="0" y="0" width="552" height="24" rx="8" ry="8" />
    <!-- Progress fill: 39% of 552 = 215.28 -->
    <rect class="bar" x="0" y="0" width="215.28" height="24" rx="8" ry="8" />
  </g>

  <text x="512" y="92" class="text">39%</text>

  <text x="24" y="122" class="muted">Last updated: 2026-08-03T13:02:05Z</text>

  <title>Sprint progress gauge: 39% implemented (7/18)</title>
</svg>
