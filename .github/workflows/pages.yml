name: Deploy Enterprise Reporting Portal to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "portal/**"
      - "dashboard-gallery/**"
      - "reports/**"
      - "dashboards/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble enterprise portal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          # Publish the shared enterprise portal as the website home page.
          cp -R portal/. _site/

          # Preserve the existing interactive executive gallery under /gallery/.
          mkdir -p _site/gallery
          cp -R dashboard-gallery/. _site/gallery/

          # Publish independent report areas for portal embedding and direct access.
          if [ -d reports ]; then
            mkdir -p _site/reports
            cp -R reports/. _site/reports/
          fi

          if [ -d dashboards ]; then
            mkdir -p _site/dashboards
            cp -R dashboards/. _site/dashboards/
          fi

          if [ -d assets ]; then
            mkdir -p _site/assets
            cp -R assets/. _site/assets/
          fi

          touch _site/.nojekyll

      - name: Upload enterprise reporting portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
